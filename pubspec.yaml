name: mikro
description: A private, on-device gallery cleaner.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  photo_manager: ^3.8.0
  video_player: ^2.14.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  image: ^4.5.4
  shared_preferences: ^2.5.3
  flutter_onnxruntime: 1.9.0
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/demo/
    - assets/models/
  fonts:
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
